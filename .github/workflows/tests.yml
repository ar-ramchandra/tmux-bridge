name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: |
          if [ "$(uname)" = Darwin ]; then
            brew list tmux >/dev/null 2>&1 || brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - run: python -m pip install '.[notifications,mcp]' build
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm test
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/direct-display.cjs
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          TOUCH_MODE: '0'
